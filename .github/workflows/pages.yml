name: Build Document Atlas for Pages branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: document-atlas-project-family-expansion
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Office generation libraries
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 openpyxl==3.1.5
      - name: Generate Word and Excel files
        run: python scripts/build_office.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PowerPoint generation library
        run: npm install --no-save --no-package-lock pptxgenjs@3.12.0
      - name: Generate PowerPoint
        run: node scripts/build_deck.js
      - name: Validate all public download links
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          catalog=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          files=[root/f'templates/{n:02d}_{suffix}' for n,suffix in []]
          for p in ['index.html',
            'templates/01_target_sharepoint_architecture.docx',
            'templates/02_migration_requirements_template.docx',
            'templates/03_solution_target_top7_metadata.xlsx',
            'templates/04_simple_category_family_library_mapping.xlsx',
            'templates/05_source_to_target_mapping.xlsx',
            'templates/06_workshop_before_after_comparison.xlsx',
            'templates/07_detailed_architecture_traceability.xlsx',
            'templates/08_detailed_document_level_mapping.xlsx',
            'templates/09_decision_workshop_process_validation.pptx',
            'assets/architecture-preview.svg',
            'assets/requirements-preview.svg',
            'assets/decision-workshop-preview.svg']:
            f=root/p
            assert f.exists() and f.stat().st_size>50, f'Missing: {p}'
          assert len(catalog['templates'] if isinstance(catalog,dict) else catalog)==48
          for p in [
            'templates/10_eu_institution_integration_guide.docx',
            'templates/11_institutional_field_mapping.xlsx',
            'templates/12_institutional_rules_traceability.xlsx',
            'templates/13_institutional_handover_register.xlsx',
            'templates/14_consumer_credit_api_governance_guide.docx',
            'templates/15_consumer_credit_product_vehicle_api.xlsx',
            'templates/16_consumer_credit_agile_backlog.xlsx',
            'templates/17_consumer_credit_dms_control.xlsx']:
            f=root/p
            assert f.exists() and f.stat().st_size>500, f'Missing sector model: {p}'
          for p in [
            'templates/18_ai_delivery_14_phase_guide.docx',
            'templates/19_ai_use_case_roi_canvas.xlsx',
            'templates/20_ai_eval_hitl_risk_register.xlsx',
            'templates/21_ai_prompt_rag_eval_spec.docx',
            'templates/22_junior_discovery_repository_document.xlsx',
            'templates/23_junior_workflow_interface_decisions.xlsx',
            'templates/24_junior_document_discovery_workshop.docx',
            'templates/25_payment_control_mapping.xlsx',
            'templates/26_payment_test_evidence_chain.xlsx',
            'templates/27_payment_assurance_functional_spec.docx',
            'templates/28_payment_claims_validation.xlsx']:
            f=root/p
            assert f.exists() and f.stat().st_size>500, f'Missing project model: {p}'
          for p in [
            'templates/29_structural_assurance_assessment_guide.docx',
            'templates/30_structural_model_relations.xlsx',
            'templates/31_structural_invariants_tests.xlsx',
            'templates/32_structural_findings_recovery.xlsx',
            'templates/33_dms_control_tower_workshop_playbook.docx',
            'templates/34_dms_ten_workshops_register.xlsx',
            'templates/35_dms_classification_migration_mapping.xlsx',
            'templates/36_dms_access_retention_pilot.xlsx',
            'templates/37_consulting_mission_billing_playbook.docx',
            'templates/38_mission_timesheet_invoice_control.xlsx',
            'templates/39_mission_billing_reconciliation.xlsx',
            'templates/40_pmo_portfolio_governance_playbook.docx',
            'templates/41_pmo_phase_workshop_catalog.xlsx',
            'templates/42_pmo_portfolio_raid_benefits.xlsx',
            'templates/43_pmo_kpi_gate_maturity.xlsx',
            'templates/44_enterprise_fraud_assurance_architecture.docx',
            'templates/45_enterprise_detector_catalog.xlsx',
            'templates/46_enterprise_assurance_proof_register.xlsx',
            'templates/47_mobile_twa_release_governance.docx',
            'templates/48_android_twa_release_checklist.xlsx']:
            f=root/p
            assert f.exists() and f.stat().st_size>500, f'Missing new project template: {p}'
          print('All 48 synthetic Office assets and preview links present')
          PY
      - name: Prepare branch-published site in docs/
        run: |
          mkdir -p docs/assets docs/templates
          cp index.html catalog.json README.md docs/
          cp assets/*.svg docs/assets/
          cp templates/*.docx templates/*.xlsx templates/*.pptx templates/*.csv templates/*.md docs/templates/
          touch docs/.nojekyll
      - name: Commit built static site to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Site files unchanged."
          else
            git commit -m "Publish synthetic Office downloads and web app to docs/"
            git push origin HEAD:main
          fi
